name: CI

on:
  push:
    paths-ignore:
      - "docs/**"
      - "README*.md"
      - "LICENSE"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  scope:
    name: Determine changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      statuses: read
    outputs:
      media_changed: ${{ steps.filter.outputs.media }}
      dependencies_changed: ${{ steps.filter.outputs.dependencies }}
      backend_image_changed: ${{ steps.filter.outputs.backend_image }}
      caddy_config_changed: ${{ steps.filter.outputs.caddy_config }}
      deployment_required: ${{ steps.filter.outputs.deployment }}
      maru_promote: ${{ steps.filter.outputs.maru_promote }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Detect relevant changes
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          # The base is the last commit that actually reached production, not
          # the push's previous tip. An amend or a rebase makes
          # `github.event.before` a commit this history no longer contains, and
          # the diff against it reports only what the rewrite touched: a backend
          # fix pushed, then amended for a one-line test tweak, went green with
          # nothing deployed. The deployment status this workflow writes on the
          # commit it shipped is the record of what production is running, so
          # every commit after it is what this run has to deploy.
          base_sha=""
          while IFS= read -r sha; do
            if [ "$sha" = "$HEAD_SHA" ]; then
              continue
            fi
            state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/status" \
              --jq '.statuses[] | select(.context == "production deployment") | .state')
            if [ "$state" = "success" ]; then
              base_sha="$sha"
              break
            fi
          done < <(git rev-list --max-count=50 "$HEAD_SHA")
          # Nothing in reach was deployed: a first run, a branch that never
          # deploys, or a gap longer than the walk. Treating the whole history
          # as the change deploys once too often, which is the safe direction.
          if [ -z "$base_sha" ]; then
            base_sha=$(git rev-list --max-parents=0 "$HEAD_SHA" | tail -n 1)
          fi
          echo "Measuring changes since $base_sha"

          media=false
          dependencies=false
          backend_image=false
          caddy_config=false
          deployment=false

          while IFS= read -r path; do
            case "$path" in
              deploy/media-processor/compose.yml|deploy/media-processor/Dockerfile|deploy/media-processor/Dockerfile.dockerignore|deploy/media-processor/Dockerfile.runtime-base|crates/media_processor/Cargo.toml|crates/media_processor/src/*)
                media=true
                deployment=true
                ;;
              # The recipe both executors encode with: both images are built from it.
              crates/vertical_media/Cargo.toml|crates/vertical_media/src/*)
                media=true
                backend_image=true
                deployment=true
                ;;
              # The manifests that pin every dependency of both images, which
              # the audit reads.
              Cargo.toml|Cargo.lock)
                media=true
                dependencies=true
                backend_image=true
                deployment=true
                ;;
              # The image's inspection: a change to it is proven on a fresh image.
              crates/xtask/src/image_smoke.rs)
                backend_image=true
                deployment=true
                ;;
              # The deployment itself: proven by deploying.
              crates/xtask/src/deploy_release.rs)
                deployment=true
                ;;
              # Tests, crate READMEs and the developer tooling are not in the image.
              crates/*/tests/* | crates/*/README.md | crates/xtask/*)
                ;;
              # The image carries the deploy agent too (crates/deploy_agent),
              # which the deployment installs on the host when it changed.
              rust-toolchain.toml | crates/* | Dockerfile | Dockerfile.dockerignore)
                backend_image=true
                deployment=true
                ;;
              deploy/studio.compose.yaml | deploy/alex.env | deploy/maru.env)
                deployment=true
                ;;
              deploy/caddy/*)
                caddy_config=true
                deployment=true
                ;;
              .github/workflows/check.yml)
                backend_image=true
                deployment=true
                ;;
            esac
          done < <(git diff --name-only --no-renames "$base_sha" "$HEAD_SHA")

          # A failed deployment deliberately leaves :latest on production's
          # previous image. Every later deployment revision therefore needs
          # its own image; reusing :latest here would silently roll code back.
          if [ "$deployment" = "true" ]; then
            backend_image=true
          fi

          {
            echo "media=$media"
            echo "dependencies=$dependencies"
            echo "backend_image=$backend_image"
            echo "caddy_config=$caddy_config"
            echo "deployment=$deployment"
          } >> "$GITHUB_OUTPUT"

          # A `Deploy-Maru: yes` trailer on any commit in the push promotes the
          # release to the second Studio in the same run. Read as a trailer, not
          # as a substring of the message: a subject that merely mentions Maru,
          # or a quoted trailer inside a body, must not deploy to an audience.
          maru_promote=false
          while IFS= read -r sha; do
            if git log -1 --format=%B "$sha" | git interpret-trailers --parse | grep -qiE '^Deploy-Maru:[[:space:]]*(yes|true)$'; then
              maru_promote=true
            fi
          done < <(git rev-list "$base_sha".."$HEAD_SHA")

          # The trailer asks for a promotion of this run's release. Without a
          # deployment there is no release to promote, and silently ignoring the
          # request is how a Maru change sits unshipped while the push is green.
          if [ "$maru_promote" = "true" ] && [ "$deployment" != "true" ]; then
            echo "Deploy-Maru was requested but nothing in this push deploys." >&2
            exit 1
          fi
          echo "maru_promote=$maru_promote" >> "$GITHUB_OUTPUT"

          echo "Changed areas: media=$media dependencies=$dependencies backend_image=$backend_image caddy_config=$caddy_config deployment=$deployment maru_promote=$maru_promote"

  deployment-status-pending:
    name: Production deployment
    needs: scope
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.scope.result == 'success' &&
      needs.scope.outputs.deployment_required == 'true'
    permissions:
      statuses: write
    runs-on: ubuntu-latest
    steps:
      - name: Mark production deployment as pending
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state=pending \
            -f context='production deployment' \
            -f description='Waiting for CI and production deployment' \
            -f target_url="$TARGET_URL"

  quality-analysis:
    name: Repository analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # For `cargo xtask family-routes`, below.
      - uses: ./.github/actions/setup-rust
      - name: Production proxy
        run: |
          set -euo pipefail
          docker compose -f deploy/caddy/compose.yaml config --quiet
          file=deploy/caddy/Caddyfile
          docker run --rm -v "$PWD/$file:/etc/caddy/Caddyfile:ro" \
            -e DOMAIN=publisher.example.com -e ACME_EMAIL=ci@example.com \
            caddy:2.10-alpine sh -c 'caddy fmt /etc/caddy/Caddyfile >/dev/null && caddy validate --adapter caddyfile --config /etc/caddy/Caddyfile'
          # Assert on what Caddy builds, not on what the file says. A snippet
          # that silently fails to expand leaves every visitor arriving as the
          # proxy, which turns the application's rate limit into one global
          # budget and looks completely healthy from outside. Caddy
          # canonicalises the header to X-Real-Ip, so match that spelling.
          adapted=$(docker run --rm -v "$PWD/$file:/etc/caddy/Caddyfile:ro" \
            -e DOMAIN=publisher.example.com -e ACME_EMAIL=ci@example.com \
            caddy:2.10-alpine caddy adapt --adapter caddyfile --config /etc/caddy/Caddyfile)
          proxies=$(grep -o '"handler":"reverse_proxy"' <<<"$adapted" | wc -l)
          addressed=$(grep -o '"X-Real-Ip"' <<<"$adapted" | wc -l)
          test "$proxies" -gt 0
          test "$proxies" = "$addressed" || { echo "$file: $proxies proxies but $addressed set the client address"; exit 1; }
          printf '%s' "$adapted" | cargo xtask family-routes

  # The Studio's workspace: a deployment waits on it. The goldens it replays
  # were recorded under the production ffmpeg build, so it installs that one.
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install production ffmpeg binaries
        env:
          FFMPEG_IMAGE: mwader/static-ffmpeg:6.1.1@sha256:a44cd22b260c527f54e99517186a209b805d0a2319e0886d356e840f62a72132
        run: |
          container=$(docker create "$FFMPEG_IMAGE")
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker cp "$container:/ffmpeg" /tmp/ffmpeg
          docker cp "$container:/ffprobe" /tmp/ffprobe
          sudo install -m 0755 /tmp/ffmpeg /tmp/ffprobe /usr/local/bin/
      - uses: ./.github/actions/setup-rust
      # Saved once per toolchain and lockfile: the dependencies are what is
      # slow to build, and a per-commit save would churn the cache quota.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-${{ runner.arch }}-
      - name: Language gate
        run: cargo xtask check language
      - name: Format
        run: cargo xtask check fmt
      - name: Clippy
        run: cargo xtask check clippy
      - name: Tests
        run: cargo xtask check test

  # Cargo.lock against the RustSec advisory database on every change to it;
  # audit.yml re-runs it weekly for advisories published since.
  dependency-audit:
    name: Dependency audit
    needs: scope
    if: needs.scope.outputs.dependencies_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-audit
      - name: Dependency audit
        run: cargo-audit audit

  # Image builds do not wait for the quality gates. The gates are enforced on
  # `deploy`, so a red commit can at worst leave a published tag that nothing
  # ever activates.
  backend-image-reuse:
    name: Resolve published backend image
    needs: [scope]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.scope.outputs.deployment_required == 'true'
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.reuse.outputs.digest }}
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Decided before the build, so an unchanged image skips the build job.
      - name: Resolve published backend image
        id: reuse
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/solo-publisher:latest
          IMAGE_CHANGED: ${{ needs.scope.outputs.backend_image_changed }}
        run: |
          set -euo pipefail

          if [ "$IMAGE_CHANGED" = "true" ]; then
            echo "digest=" >> "$GITHUB_OUTPUT"
            echo "Backend sources changed; building"
            exit 0
          fi
          digest=$(docker buildx imagetools inspect "$IMAGE" 2>/dev/null | awk '$1 == "Digest:" { print $2; exit }' || true)
          if [[ "$digest" =~ ^sha256:[0-9a-fA-F]{64}$ ]]; then
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
            echo "Reusing published backend image $IMAGE@$digest"
          else
            echo "digest=" >> "$GITHUB_OUTPUT"
            echo "No published backend image found; falling back to a full build"
          fi

  backend-image:
    name: Build backend image
    needs: [scope, backend-image-reuse]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.scope.outputs.deployment_required == 'true' &&
      needs.backend-image-reuse.outputs.digest == ''
    permissions:
      contents: read
      actions: read
      packages: write
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build_image.outputs.digest }}
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Checkout source for backend image and smoke test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Build and publish backend image
        id: build_image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          build-args: |
            GIT_REVISION=${{ github.sha }}
          # Tagged with the commit only. `latest` is moved by the deploy job,
          # because the reuse check above reads it and it must keep meaning
          # "the image production is running".
          tags: ghcr.io/${{ github.repository_owner }}/solo-publisher:${{ github.sha }}
          push: true
          # Layers only: the cargo build's `--mount=type=cache` target directory
          # is not exported, so the Rust compile itself is not cached here.
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Set up Rust for image smoke test
        uses: ./.github/actions/setup-rust
      - name: Image smoke test
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/solo-publisher@${{ steps.build_image.outputs.digest }}
        run: cargo xtask image-smoke "$IMAGE"

  media-processor-image:
    name: Build media processor image
    needs: [scope]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.scope.outputs.deployment_required == 'true'
    permissions:
      contents: read
      actions: read
      packages: write
    uses: ./.github/workflows/media-processor.yml
    with:
      build-image: ${{ needs.scope.outputs.media_changed == 'true' }}
      image-tag: ${{ github.sha }}
    secrets: inherit

  deploy:
    name: Deploy immutable image
    needs:
      [
        scope,
        quality-analysis,
        rust,
        dependency-audit,
        backend-image-reuse,
        backend-image,
        media-processor-image,
      ]
    if: >-
      always() && vars.DEPLOY_ENABLED == 'true' &&
      needs.scope.result == 'success' &&
      needs.scope.outputs.deployment_required == 'true' &&
      needs.quality-analysis.result == 'success' &&
      needs.rust.result == 'success' &&
      (needs.dependency-audit.result == 'success' || needs.dependency-audit.result == 'skipped') &&
      needs.backend-image-reuse.result == 'success' &&
      (needs.backend-image.result == 'success' ||
        (needs.backend-image.result == 'skipped' && needs.backend-image-reuse.outputs.digest != '')) &&
      needs.media-processor-image.result == 'success'
    permissions:
      contents: read
      statuses: write
      packages: write
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      # The published image when nothing in it changed, otherwise this run's build.
      BACKEND_IMAGE_DIGEST: ${{ needs.backend-image-reuse.outputs.digest || needs.backend-image.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-rust
      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      - name: Configure known hosts
        env:
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Activate image and verify readiness
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_AGENT_TOKEN: ${{ secrets.DEPLOY_AGENT_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/solo-publisher@${{ env.BACKEND_IMAGE_DIGEST }}
          MEDIA_PROCESSOR_IMAGE: ghcr.io/${{ github.repository_owner }}/alexgetman-media-processor@${{ needs.media-processor-image.outputs.image_digest }}
          RELEASE: ${{ github.sha }}
          MARU_DEPLOY_ENABLED: ${{ vars.MARU_DEPLOY_ENABLED }}
          PROMOTE_MARU: ${{ needs.scope.outputs.maru_promote }}
          CADDY_CONFIG_CHANGED: ${{ needs.scope.outputs.caddy_config_changed }}
        run: cargo xtask deploy-release
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Moved only once production is serving this digest, so the reuse path in
      # the image job can never pick up something that was never deployed.
      - name: Point latest at the deployed image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/solo-publisher
        run: docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE@$BACKEND_IMAGE_DIGEST"
      # Published here rather than from a follow-up job: a whole runner boot for
      # one API call sat on the tail of every green deployment.
      - name: Publish production status
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state=success \
            -f context='production deployment' \
            -f description='Image activated and production readiness passed' \
            -f target_url="$TARGET_URL"

  deployment-status-on-ci-failure:
    name: Production deployment status on CI failure
    needs:
      [
        scope,
        quality-analysis,
        rust,
        dependency-audit,
        deployment-status-pending,
      ]
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      (
        needs.scope.result != 'success' ||
        needs.quality-analysis.result != 'success' ||
        needs.rust.result != 'success' ||
        (needs.dependency-audit.result != 'success' && needs.dependency-audit.result != 'skipped')
      )
    permissions:
      statuses: write
    runs-on: ubuntu-latest
    steps:
      - name: Mark production deployment as blocked
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state=failure \
            -f context='production deployment' \
            -f description='CI failed; production deployment was not started' \
            -f target_url="$TARGET_URL"

  # Only the paths `deploy` cannot report on itself: nothing to deploy, or a
  # deployment that never reached its final step.
  deployment-status:
    name: Production deployment status
    needs:
      [
        scope,
        quality-analysis,
        rust,
        dependency-audit,
        backend-image,
        media-processor-image,
        deploy,
      ]
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.deploy.result != 'success' &&
      needs.scope.result == 'success' &&
      needs.quality-analysis.result == 'success' &&
      needs.rust.result == 'success' &&
      (needs.dependency-audit.result == 'success' || needs.dependency-audit.result == 'skipped')
    permissions:
      statuses: write
    runs-on: ubuntu-latest
    steps:
      - name: Publish final production status
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEPLOYMENT_REQUIRED: ${{ needs.scope.outputs.deployment_required }}
        run: |
          if [ "$DEPLOYMENT_REQUIRED" != "true" ]; then
            state=success
            description='CI passed; production unchanged'
          else
            state=failure
            description='Docker build or production deployment failed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state="$state" \
            -f context='production deployment' \
            -f description="$description" \
            -f target_url="$TARGET_URL"
