[package]
name = "deploy_agent"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Runs on the hosts, not in the image that carries it: the Dockerfile builds it
# as a static musl binary, so no workspace crate belongs here (their native
# dependencies would have to build for musl too).
[[bin]]
name = "deploy-agent"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
jiff = { version = "0.2", default-features = false, features = ["std"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
subtle = "2"
tokio = { version = "1", features = ["rt", "net", "fs", "process", "time", "macros", "sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "test-util"] }
