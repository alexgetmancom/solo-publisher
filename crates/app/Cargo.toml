[package]
name = "app"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "solo-publisher"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
adapters = { path = "../adapters" }
bot = { path = "../bot" }
channels = { path = "../channels" }
delivery = { path = "../delivery" }
db = { path = "../db" }
domain = { path = "../domain" }
foundation = { path = "../foundation" }
http_edge = { path = "../http" }
mtproto = { path = "../mtproto" }
ops = { path = "../ops" }
runtime = { path = "../runtime" }
story_render = { path = "../story_render" }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
tokio = { version = "1", features = ["rt", "time", "signal", "macros", "net", "sync"] }
