name: solo-publisher

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN to the hostname this Studio answers on}
    depends_on:
      - app

  # Telegram's public API caps file downloads at 50 MB, which is below a short
  # video. A local Bot API server raises that to 2 GB, so it is part of the
  # install rather than an upgrade to discover after the first video fails.
  # It needs its own API credentials from https://my.telegram.org.
  # It cannot run without those credentials, and a site-only Studio has none, so
  # it joins the stack only once COMPOSE_PROFILES names it — one line in .env,
  # not a second command to remember.
  bot-api:
    image: aiogram/telegram-bot-api:10.2@sha256:6ab985144d46d024c723f4def72419d949b88ba97bf234dadf415051367a1b69
    profiles: [telegram]
    restart: unless-stopped
    environment:
      # Not marked required: compose interpolates inactive profiles too, so a
      # {? } here would refuse to read the file for a site-only install that
      # never starts this service.
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_LOCAL: "1"
      TELEGRAM_WORK_DIR: /var/lib/telegram-bot-api
      TELEGRAM_TEMP_DIR: /tmp/telegram-bot-api
    volumes:
      - bot-api-data:/var/lib/telegram-bot-api
    expose:
      - "8081"

  app:
    image: ${SOLO_PUBLISHER_IMAGE:-ghcr.io/alexgetmancom/solo-publisher:latest}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      # One volume: the database, media, story cards and site all derive from
      # it (foundation/config.ts). Pointing any one of them somewhere else was
      # a way to write production data onto the container's own filesystem.
      DATA_DIR: /data
      # Never under DATA_DIR: a backup on the volume it exists to survive is
      # not a backup, and `doctor` fails an install that puts it there.
      PUBLIC_MEDIA_BASE_URL: https://${DOMAIN:?set DOMAIN to the hostname this Studio answers on}/media/staging
      PUBLIC_BASE_URL: https://${DOMAIN:?set DOMAIN to the hostname this Studio answers on}
      NODE_ENV: production
      DEPLOYMENT_ENV: production
      # Caddy terminates TLS and is the only thing that can reach this port, so
      # the address it forwards is the real client's.
      TRUSTED_CLIENT_IP_HEADER: x-real-ip
      # Empty means Telegram's public API and its 50 MB download cap; the
      # bot-api profile above raises that to 2 GB.
      TELEGRAM_API_BASE_URL: ${TELEGRAM_API_BASE_URL:-https://api.telegram.org}
      BIND_HOST: 0.0.0.0
      PORT: "8788"
    volumes:
      - app-data:/data
      # A named volume is enough to survive `docker compose down`, but not the
      # disk. Point this at off-host storage; `backup-media` writes here and
      # `doctor` fails until it has, because the database backup Telegram sends
      # every day does not carry media.
    # Published on loopback only. Caddy reaches this container over the compose
    # network and does not need it; an install that already runs nginx or Traefik
    # on :80/:443 has nowhere else to point, and had to edit this file. Loopback
    # is not reachable from off the machine, so the two installs share one shape.
    ports:
      - "127.0.0.1:8788:8788"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:8788/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  app-data:
  bot-api-data:
  caddy-data:
  caddy-config:
