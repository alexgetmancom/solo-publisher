[test]
# Fail on any network request a test forgot to stub. See the preload for why.
preload = ["./scripts/no-network.ts"]

# Ratchet, not a target. Set just under the measured 90.74% lines / 85.71%
# functions (the deployment tooling; the function figure fell from 86.67% when
# the tested Stories sidecar was deleted, not from new untested code) so an
# untested new module fails CI instead of quietly diluting the average. Raise
# these when coverage rises; never lower them to make CI pass.
coverageThreshold = { line = 0.90, function = 0.85 }
# Test files are trivially ~100% covered by themselves and would inflate the
# average past the point where the threshold means anything.
coverageSkipTestFiles = true
