[test]
# Fail on any network request a test forgot to stub. See the preload for why.
preload = ["./scripts/no-network.ts"]

# Ratchet, not a target. Set just under the measured 89.31% lines / 86.67%
# functions (the sidecar and the deployment tooling) so an untested new module
# fails CI instead of quietly diluting the average. Raise these when coverage
# rises; never lower them to make CI pass.
coverageThreshold = { line = 0.89, function = 0.86 }
# Test files are trivially ~100% covered by themselves and would inflate the
# average past the point where the threshold means anything.
coverageSkipTestFiles = true
