# The Rust Studio in place of the TypeScript one, layered over compose.yaml:
#
#   docker compose -f compose.yaml -f compose.rust.yaml up -d --build
#
# Same services, volume, ports, environment and healthcheck (the image carries
# Bun for the Stories sidecar, so `bun -e fetch(/readyz)` still answers). Only
# the app's image changes: built here from Dockerfile.rust until a Rust image
# is published. The sidecar runs inside the app container and needs nothing
# configured; TELEGRAM_CHANNEL_STORIES_* in .env reach it as before. The
# entrypoint sets STORIES_SIDECAR_URL (http://127.0.0.1:8790) and a fresh
# STORIES_SIDECAR_TOKEN for the Studio, and the same token and port
# (STORIES_SIDECAR_PORT) for the sidecar; do not set them in .env.
services:
  app:
    image: ${SOLO_PUBLISHER_RUST_IMAGE:-solo-publisher-rust:local}
    build:
      context: .
      dockerfile: Dockerfile.rust
